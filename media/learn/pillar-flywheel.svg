<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <title>Lead Generation Flywheel</title>
  
  <defs>
    <linearGradient id="tealGradient" x1="360" y1="160" x2="180" y2="263.92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03AD9C" />
      <stop offset="100%" stop-color="#37bd7e" />
    </linearGradient>
    <linearGradient id="violetGradient" x1="180" y1="263.92" x2="180" y2="56.08" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8129D7" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="emeraldGradient" x1="180" y1="56.08" x2="360" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#37bd7e" />
      <stop offset="100%" stop-color="#03AD9C" />
    </linearGradient>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#03AD9C" />
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
    </filter>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#8129D7" stroke-width="0.5" opacity="0.1"/>
    </pattern>

    <g id="icon-audience" fill="#a0a8b7">
      <circle cx="0" cy="-2" r="4"/>
      <circle cx="-6" cy="5" r="2.5"/>
      <circle cx="6" cy="5" r="3"/>
    </g>
    <path id="icon-offer" d="M 0 -8 L 7 0 L 0 8 L -7 0 Z" fill="#a0a8b7" />
    <g id="icon-channel" stroke="#a0a8b7" stroke-width="1.5" stroke-linecap="round">
      <circle cx="0" cy="0" r="3.5" fill="#a0a8b7"/>
      <line x1="0" y1="0" x2="10" y2="0"/>
      <line x1="0" y1="0" x2="-5" y2="-8.66"/>
      <line x1="0" y1="0" x2="-5" y2="8.66"/>
    </g>
    <path id="chevron-shape" d="M -6 -8 L 2 0 L -6 8" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }

    .main-group {
      animation: enter 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .arc {
      opacity: 0.3;
      animation: light-up 3s linear infinite both;
    }
    #arc2 { animation-delay: 1s; }
    #arc3 { animation-delay: 2s; }

    .chevron {
      opacity: 0.4;
      animation: chevron-flash 3s linear infinite both;
    }
    #chevron1 { animation-delay: 1s; }
    #chevron2 { animation-delay: 2s; }
    #chevron3 { animation-delay: 0s; }

    .center-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: center-pulse 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite both;
    }

    .halo {
      transform-box: fill-box;
      transform-origin: center;
      animation: halo-pulse 3s cubic-bezier(0.16, 1, 0.3, 1) infinite both;
    }

    @keyframes enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes light-up {
      0% { opacity: 1; }
      33.33%, 100% { opacity: 0.3; }
    }

    @keyframes chevron-flash {
      0%, 5% { opacity: 1; }
      6%, 100% { opacity: 0.4; }
    }

    @keyframes center-pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes halo-pulse {
      from { transform: scale(1); opacity: 0.7; }
      to { transform: scale(1.6); opacity: 0; }
    }
  </style>

  <rect width="480" height="320" fill="#070b18"/>
  <rect width="480" height="320" fill="url(#grid)"/>

  <g class="main-group">
    <g class="flywheel" fill="none" stroke-width="8" stroke-linecap="round">
      <path class="arc" id="arc1" stroke="url(#tealGradient)" d="M 360,160 A 120,120 0 0 1 180,263.92" />
      <path class="arc" id="arc2" stroke="url(#violetGradient)" d="M 180,263.92 A 120,120 0 0 1 180,56.08" />
      <path class="arc" id="arc3" stroke="url(#emeraldGradient)" d="M 180,56.08 A 120,120 0 0 1 360,160" />

      <g stroke="#ffffff">
        <use href="#chevron-shape" class="chevron" id="chevron1" transform="translate(180, 263.92) rotate(210)" />
        <use href="#chevron-shape" class="chevron" id="chevron2" transform="translate(180, 56.08) rotate(330)" />
        <use href="#chevron-shape" class="chevron" id="chevron3" transform="translate(360, 160) rotate(90)" />
      </g>
      
      <g stroke="none">
        <use href="#icon-audience" transform="translate(300, 263.92) scale(0.9)" />
        <use href="#icon-offer" transform="translate(120, 160) scale(0.9)" />
        <use href="#icon-channel" transform="translate(300, 56.08) scale(0.9)" />
      </g>
    </g>
    
    <g class="center-elements">
      <circle cx="240" cy="160" r="40" fill="none" stroke="#03AD9C" stroke-width="2" class="halo" filter="url(#glow)"/>
      <circle cx="240" cy="160" r="30" fill="url(#centerGradient)" class="center-pulse"/>
    </g>
  </g>
</svg>