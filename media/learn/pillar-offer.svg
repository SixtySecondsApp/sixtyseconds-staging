<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <title>Magnetic Pull Animation</title>
  
  <defs>
    <linearGradient id="diamondGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b060ff" />
      <stop offset="100%" stop-color="#8129D7" />
    </linearGradient>

    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8129D7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070b18" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(129, 41, 215, 0.08)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }

    .center-transform {
      transform-box: fill-box;
      transform-origin: center;
    }

    .diamond {
      animation: pulse 2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      animation-fill-mode: both;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .ring {
      animation: radiate 1.8s ease-out infinite;
      animation-fill-mode: both;
    }

    @keyframes radiate {
      from { transform: scale(0.5); opacity: 1; stroke-width: 2; }
      to { transform: scale(4.5); opacity: 0; stroke-width: 0; }
    }

    .d1 { animation: d1 4.5s ease-in-out infinite alternate; animation-delay: 0s; }
    .d2 { animation: d2 4.2s ease-in-out infinite alternate; animation-delay: 0.5s; }
    .d3 { animation: d3 4.8s ease-in-out infinite alternate; animation-delay: 1.1s; }
    .d4 { animation: d4 4.0s ease-in-out infinite alternate; animation-delay: 0.3s; }
    .d5 { animation: d5 4.6s ease-in-out infinite alternate; animation-delay: 1.5s; }
    .d6 { animation: d6 4.3s ease-in-out infinite alternate; animation-delay: 0.8s; }
    .d7 { animation: d7 4.9s ease-in-out infinite alternate; animation-delay: 1.2s; }
    .d8 { animation: d8 4.1s ease-in-out infinite alternate; animation-delay: 0.2s; }

    @keyframes d1 { to { transform: translate(84px, 48px); } }
    @keyframes d2 { to { transform: translate(96px, -36px); } }
    @keyframes d3 { to { transform: translate(36px, -72px); } }
    @keyframes d4 { to { transform: translate(-36px, -78px); } }
    @keyframes d5 { to { transform: translate(-96px, -30px); } }
    @keyframes d6 { to { transform: translate(-84px, 60px); } }
    @keyframes d7 { to { transform: translate(-6px, 72px); } }
    @keyframes d8 { to { transform: translate(54px, 0px); } }

  </style>

  <rect width="480" height="320" fill="#070b18" />
  <rect width="480" height="320" fill="url(#grid)" />
  <rect width="480" height="320" fill="url(#bgGlow)" />

  <g>
    <circle class="ring center-transform" cx="240" cy="160" r="30" fill="none" stroke="#37bd7e"/>
    <circle class="ring center-transform" cx="240" cy="160" r="30" fill="none" stroke="#37bd7e" style="animation-delay: 0.6s;"/>
    <circle class="ring center-transform" cx="240" cy="160" r="30" fill="none" stroke="#03AD9C" style="animation-delay: 1.2s;"/>
  </g>

  <g fill="#8129D7" opacity="0.6">
    <g transform="translate(100, 80)"> <circle class="d1" r="5" /> </g>
    <g transform="translate(80, 220)"> <rect class="d2 center-transform" x="-4" y="-4" width="8" height="8" /> </g>
    <g transform="translate(180, 280)"> <circle class="d3" r="6" /> </g>
    <g transform="translate(300, 290)"> <rect class="d4 center-transform" x="-5" y="-5" width="10" height="10" /> </g>
    <g transform="translate(400, 210)"> <circle class="d5" r="4" /> </g>
    <g transform="translate(380, 60)"> <rect class="d6 center-transform" x="-4.5" y="-4.5" width="9" height="9" /> </g>
    <g transform="translate(250, 40)"> <circle class="d7" r="5.5" /> </g>
    <g transform="translate(150, 160)"> <rect class="d8 center-transform" x="-5.5" y="-5.5" width="11" height="11" /> </g>
  </g>

  <g filter="url(#glow)">
    <rect class="diamond center-transform" x="220" y="140" width="40" height="40" fill="url(#diamondGradient)" transform="rotate(45 240 160)" />
  </g>

</svg>