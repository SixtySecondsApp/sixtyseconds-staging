<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <title>Multi-channel Convergence Flow</title>
  
  <defs>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8129D7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#8129D7" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }

    .icon {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: popIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    #icon-top { animation-delay: 0.1s; }
    #icon-mid { animation-delay: 0.5s; }
    #icon-bot { animation-delay: 0.9s; }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.3); }
      to { opacity: 1; transform: scale(1); }
    }

    .path-base {
      stroke-opacity: 0.15;
      stroke-width: 2;
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: drawIn 1.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    #path-top-base { animation-delay: 0.3s; }
    #path-mid-base { animation-delay: 0.7s; }
    #path-bot-base { animation-delay: 1.1s; }
    @keyframes drawIn {
      to { stroke-dashoffset: 0; }
    }

    .path-flow {
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 5 25;
      opacity: 0;
      animation: flow 1.5s linear infinite, fadeIn 0.5s both;
    }
    #path-top-flow { animation-delay: 0.6s; }
    #path-mid-flow { animation-delay: 1.0s; }
    #path-bot-flow { animation-delay: 1.4s; }
    @keyframes flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -60; }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    #convergence-point {
      opacity: 0;
      animation: convergence-appear 1s cubic-bezier(0.16,1,0.3,1) 1.8s both, 
                 pulse 1.5s cubic-bezier(0.34,1.56,0.64,1) 2.8s infinite;
    }
    @keyframes convergence-appear {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.4); }
    }
    .spoke {
      stroke: #fff;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
  </style>

  <rect width="480" height="320" fill="#070b18" />
  <rect width="480" height="320" fill="url(#gridPattern)" />

  <!-- Channel 1: Top (Teal) -->
  <g id="channel-top">
    <g id="icon-top" class="icon" transform="translate(25 90)" fill="#03AD9C">
      <rect x="-12" y="-8" width="24" height="16" rx="2"/>
      <path d="M -12 -8 L 0 2 L 12 -8" stroke="#03AD9C" stroke-width="1.5" fill="none"/>
    </g>
    <path id="path-top-base" class="path-base" d="M 25,90 C 150,90 300,160 440,160" fill="none" stroke="#03AD9C"/>
    <path id="path-top-flow" class="path-flow" d="M 25,90 C 150,90 300,160 440,160" fill="none" stroke="#03AD9C"/>
  </g>

  <!-- Channel 2: Middle (Violet) -->
  <g id="channel-mid">
    <g id="icon-mid" class="icon" transform="translate(25 160)" fill="#8129D7">
      <rect x="-10" y="-10" width="20" height="20" rx="3"/>
    </g>
    <path id="path-mid-base" class="path-base" d="M 25,160 L 440,160" fill="none" stroke="#8129D7"/>
    <path id="path-mid-flow" class="path-flow" d="M 25,160 L 440,160" fill="none" stroke="#8129D7"/>
  </g>
  
  <!-- Channel 3: Bottom (Emerald) -->
  <g id="channel-bot">
    <g id="icon-bot" class="icon" transform="translate(25 230)" fill="#37bd7e">
      <rect x="-12" y="-9" width="24" height="18" rx="9"/>
      <path d="M 0 9 L 0 14 L 6 9 Z"/>
    </g>
    <path id="path-bot-base" class="path-base" d="M 25,230 C 150,230 300,160 440,160" fill="none" stroke="#37bd7e"/>
    <path id="path-bot-flow" class="path-flow" d="M 25,230 C 150,230 300,160 440,160" fill="none" stroke="#37bd7e"/>
  </g>

  <!-- Convergence Point -->
  <g id="convergence-point" transform="translate(440, 160)" filter="url(#glowFilter)">
    <g class="spokes">
      <line class="spoke" x1="12" y1="0" x2="18" y2="0"/>
      <line class="spoke" x1="12" y1="0" x2="18" y2="0" transform="rotate(45)"/>
      <line class="spoke" x1="12" y1="0" x2="18" y2="0" transform="rotate(90)"/>
      <line class="spoke" x1="12" y1="0" x2="18" y2="0" transform="rotate(135)"/>
      <line class="spoke" x1="12" y1="0" x2="18" y2="0" transform="rotate(180)"/>
      <line class="spoke" x1="12" y1="0" x2="18" y2="0" transform="rotate(225)"/>
      <line class="spoke" x1="12" y1="0" x2="18" y2="0" transform="rotate(270)"/>
      <line class="spoke" x1="12" y1="0" x2="18" y2="0" transform="rotate(315)"/>
    </g>
    <circle r="10" fill="url(#glowGradient)"/>
  </g>
</svg>